spring.application.name=learnai

# Gemini caps inline requests at 20MB and audio is base64-encoded (+33%), so 14MB of audio stays under it.
spring.servlet.multipart.max-file-size=14MB
# Request limit leaves headroom for multipart overhead and form fields.
spring.servlet.multipart.max-request-size=15MB

# AI (Google Gemini) is enabled only when LEARNAI_CHAT_MODEL=google-genai and GEMINI_API_KEY are set.
# Without it, documents use a regex extractor and /api/audio/transcribe returns 503.
spring.ai.model.chat=${LEARNAI_CHAT_MODEL:none}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}

# Directory where English transcripts are saved.
learnai.audio.output-dir=${LEARNAI_AUDIO_OUTPUT_DIR:transcripts}

# Rule 1: allowed characters for the document name (letters separated by single spaces).
learnai.rules.name.pattern=^\\p{L}+( \\p{L}+)*$

# MongoDB (local Docker: 'docker compose up -d'). Docker Desktop on Windows publishes the container on localhost:27017.
# directConnection=true is needed because the Atlas local image runs a single-node replica set.
spring.mongodb.uri=${MONGODB_URI:mongodb://${MONGODB_USERNAME:learnai}:${MONGODB_PASSWORD:learnai}@${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/${MONGODB_DATABASE:learnai}?authSource=admin&directConnection=true}

# Embeddings (Google Gemini) follow LEARNAI_CHAT_MODEL unless LEARNAI_EMBEDDING_MODEL is set.
# The connection is created by GeminiEmbeddingConfig only when embeddings are enabled.
spring.autoconfigure.exclude=org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
spring.ai.model.embedding.text=${LEARNAI_EMBEDDING_MODEL:${LEARNAI_CHAT_MODEL:none}}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

# MongoDB Atlas Vector Search is enabled only when LEARNAI_VECTOR_STORE=mongodb-atlas (needs the embedding model above).
# Without it, /api/vectors/** returns 503.
spring.ai.vectorstore.type=${LEARNAI_VECTOR_STORE:none}
spring.ai.vectorstore.mongodb.initialize-schema=true
spring.ai.vectorstore.mongodb.collection-name=${LEARNAI_VECTOR_COLLECTION:vector_store}
spring.ai.vectorstore.mongodb.index-name=${LEARNAI_VECTOR_INDEX:vector_index}
spring.ai.vectorstore.mongodb.path-name=embedding
# Metadata fields that can be used in search filters (changing this requires dropping the existing search index).
spring.ai.vectorstore.mongodb.metadata-fields-to-filter=${LEARNAI_VECTOR_FILTER_FIELDS:source,category}
