spring.application.name=learnai

# OpenAI's speech-to-text API accepts files up to 25MB.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# AI extraction is enabled only when OPENAI_API_KEY is set; otherwise a regex extractor is used.
spring.ai.model.chat=${LEARNAI_CHAT_MODEL:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

# Speech-to-text (POST /api/audio/transcribe) follows LEARNAI_CHAT_MODEL unless overridden.
spring.ai.model.audio.transcription=${LEARNAI_TRANSCRIPTION_MODEL:${LEARNAI_CHAT_MODEL:none}}
spring.ai.openai.audio.transcription.options.model=${OPENAI_TRANSCRIPTION_MODEL:whisper-1}
# Directory where English transcripts are saved.
learnai.audio.output-dir=${LEARNAI_AUDIO_OUTPUT_DIR:transcripts}

# Rule 1: allowed characters for the document name (letters separated by single spaces).
learnai.rules.name.pattern=^\\p{L}+( \\p{L}+)*$
