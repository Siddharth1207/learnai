spring.application.name=learnai

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# AI extraction is enabled only when OPENAI_API_KEY is set; otherwise a regex extractor is used.
spring.ai.model.chat=${LEARNAI_CHAT_MODEL:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

# Rule 1: allowed characters for the document name (letters separated by single spaces).
learnai.rules.name.pattern=^\\p{L}+( \\p{L}+)*$
